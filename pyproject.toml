[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biflow"
version = "1.0.0"
description = "Lightweight bidirectional residual feature compensation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

[tool.setuptools]
py-modules = ["biflow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
